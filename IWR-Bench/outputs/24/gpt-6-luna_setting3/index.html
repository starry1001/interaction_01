ou have any questions or concerns, feel free to ask in the discussion below. You can also close the discussion if you don't have any questions.</p></div></article><div class="comment-box"><div class="comment-tabs"><button class="btn ${commentPreview?'':'active'}" id="editComment">Edit</button><button class="btn ${commentPreview?'active':''}" id="previewComment">Preview</button></div>${commentPreview?'<div class="preview-empty">Nothing to preview</div>':'<textarea placeholder="Leave a comment"></textarea><div style="padding:0 18px 16px;color:#aaa">▣ Upload images, audio, and videos by dragging in the text input, pasting, or clicking here.</div>'}<div class="comment-foot">Your need to confirm your account before you can post a new comment.<br><button class="soft btn" disabled style="color:#aaa">◉ Comment</button></div></div></section>`;

function render(page=currentPage){
 currentPage=page;
 document.body.classList.toggle('studio-mode',page==='studio');
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 const c=document.getElementById('content');
 if(page==='card')c.innerHTML=cardPage();
 else if(page==='studio')c.innerHTML=studioPage();
 else if(page==='files')c.innerHTML=filesPage();
 else c.innerHTML=communityPage();
 bindPage();
}
function showToast(msg){let t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function bindPage(){
 const split=document.getElementById('splitSelect');
 if(split)split.onclick=()=>{let m=document.getElementById('splitMenu');m.style.display=m.style.display==='block'?'none':'block'};
 document.querySelectorAll('[data-split]').forEach(b=>b.onclick=()=>{splitName=b.dataset.split;selected=-1;render(currentPage)});
 document.querySelectorAll('tbody tr').forEach(tr=>tr.onclick=()=>{selected=Number(tr.dataset.row);tr.classList.toggle('selected');});
 const issue=document.getElementById('openIssue');if(issue)issue.onclick=()=>{discussionDetail=true;render('community')};
 const folder=document.querySelector('[data-folder]');if(folder)folder.onclick=()=>{document.querySelector('.files-content').innerHTML=dataFolderPage();bindPage()};
 const back=document.getElementById('backFiles');if(back)back.onclick=()=>render('files');
 const run=document.getElementById('runQuery');if(run)run.onclick=()=>{run.textContent='Loading...';setTimeout(()=>run.textContent='Run Query',900)};
 const prev=document.getElementById('previewComment');if(prev)prev.onclick=()=>{commentPreview=true;render('community')};
 const edit=document.getElementById('editComment');if(edit)edit.onclick=()=>{commentPreview=false;render('community')};
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{discussionDetail=false;render(b.dataset.page)}));
document.getElementById('resend').onclick=()=>showToast('Confirmation email sent');
render('card');
</script>
