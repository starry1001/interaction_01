<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenReview</title>
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    margin: 0;
    background: #fcfaf7;
    color: #303943;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
  }
  a, button { color: #527f8e; }
  a { text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; color: #315e6b; }
  .btn { cursor: pointer; }
  .topbar {
    height: 54px;
    background: #8d1015;
    color: #fff;
    border-radius: 0 0 5px 5px;
  }
  .top-inner {
    width: min(1140px, calc(100% - 34px));
    height: 100%;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .brand {
    color: white;
    font-size: 20px;
    font-weight: 700;
    white-space: nowrap;
  }
  .brand span { color: #d8c9c9; font-weight: 400; }
  .search {
    width: 380px;
    height: 31px;
    padding: 5px 12px;
    border: 1px solid #aaa;
    border-radius: 2px;
    background: #f5f5f5;
    color: #444;
    font-size: 13px;
  }
  .login { margin-left: auto; color: #fff; font-size: 13px; }
  .subbar {
    height: 42px;
    background: #dedede;
    color: #667b85;
    font-size: 12px;
  }
  .sub-inner {
    width: min(1140px, calc(100% - 34px));
    height: 100%;
    margin: auto;
    display: flex;
    align-items: center;
  }
  .container { width: min(1140px, calc(100% - 36px)); margin: 0 auto; }
  .content { padding-top: 28px; }
  h1, h2, h3 { color: #303b46; }
  h1 { font-size: 29px; margin: 0 0 22px; }
  h2 { font-size: 21px; margin: 0 0 17px; }
  h3 { font-size: 18px; margin: 0 0 12px; }
  .home-columns {
    display: grid;
    grid-template-columns: 1fr 1.12fr;
    gap: 58px;
    margin-bottom: 40px;
  }
  .home-columns h3 { border-bottom: 1px solid #eee9e4; padding-bottom: 11px; }
  .venue-list { display: flex; flex-direction: column; gap: 10px; }
  .venue-link { font-size: 17px; color: #68818a; }
  .venue-date { font-size: 11px; color: #444; margin-top: 3px; }
  .show-all { display: inline-block; margin-top: 10px; font-size: 12px; color: #6c8790; }
  .all-venues { margin-top: 25px; padding-bottom: 36px; }
  .all-venues h3 { border-bottom: 1px solid #ebe7e2; padding-bottom: 10px; margin-bottom: 11px; }
  .venue-cloud { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 18px; line-height: 1.45; }
  .venue-cloud a { color: #66818b; font-size: 15px; white-space: nowrap; }
  .venue-cloud a.featured { color: #871b22; font-weight: bold; }
  .footer {
    background: #f0ede7;
    color: #34414b;
    text-align: center;
    padding: 20px 10px 16px;
    margin-top: 32px;
    font-size: 13px;
  }
  .footer-links {
    width: min(760px, 100%);
    margin: auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px 28px;
  }
  .footer a { color: #35424b; }
  .copyright {
    background: #293746;
    color: #78828b;
    padding: 20px;
    text-align: center;
    font-size: 12px;
  }
  .breadcrumb {
    height: 42px;
    background: #dedede;
    color: #65808a;
    font-size: 13px;
  }
  .breadcrumb .container { height: 100%; display: flex; align-items: center; }
  .listing { min-height: 850px; padding-top: 28px; }
  .listing h1 { padding-bottom: 22px; border-bottom: 1px solid #eee9e4; }
  .list-links { display: flex; flex-direction: column; gap: 11px; }
  .list-links a { font-size: 16px; font-weight: bold; }
  .paper-listing { min-height: 900px; padding-top: 27px; }
  .paper-title {
    font-size: 28px;
    line-height: 1.18;
    margin: 0 0 7px;
    max-width: 1090px;
  }
  .track-subtitle { font-size: 19px; margin: 4px 0 14px; }
  .meta { color: #6c7479; font-size: 12px; line-height: 1.65; }
  .paper-item {
    border-top: 1px solid #e9e6e2;
    padding: 13px 12px 12px;
    font-size: 14px;
  }
  .paper-item a { font-weight: bold; font-size: 16px; }
  .paper-item .authors { color: #505b61; font-style: italic; font-size: 12px; margin: 4px 0; }
  .paper-item .meta { font-size: 11px; }
  .tabs {
    display: flex;
    gap: 3px;
    margin: 17px 0 12px;
    border-bottom: 1px solid #ddd7d1;
  }
  .tab {
    background: #f0ede7;
    padding: 11px 13px;
    color: #527f8e;
    border: 0;
    font-weight: bold;
    font-size: 13px;
  }
  .tab.active { background: #fff; color: #414d55; }
  .paper-abstract {
    font-size: 13px;
    line-height: 1.48;
    border-bottom: 1px solid #e8e4df;
    padding: 0 0 12px;
  }
  .paper-abstract p { margin: 5px 0; }
  .label { color: #8d2528; font-weight: bold; }
  .discussion-heading { margin: 17px 0 0; background: #f2efeb; padding: 10px 13px; font-weight: bold; }
  .tools {
    background: #f4f2ef;
    padding: 10px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .tools input, .tools select {
    height: 31px;
    border: 1px solid #6a9aa7;
    background: #fff;
    padding: 5px 9px;
    color: #555;
    font-size: 12px;
  }
  .tools input { width: 220px; }
  .tools select { width: 215px; }
  .tool-button {
    height: 31px;
    border: 1px solid #6b9aa6;
    background: #fff;
    color: #496b74;
    padding: 4px 10px;
    font-size: 13px;
  }
  .tool-button.selected { background: #527f8e; color: white; }
  .reply-count { margin-left: auto; color: #596269; font-size: 13px; }
  .audience {
    display: inline-flex;
    border: 1px solid #6b9aa6;
    color: #547984;
    background: white;
    padding: 5px 8px;
    font-size: 12px;
  }
  .public-row { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 18px 0; color: #777; font-size: 12px; }
  .public-btn {
    background: #54818e;
    color: white;
    border: 1px solid #426c77;
    border-radius: 3px;
    padding: 8px 13px;
    font-weight: bold;
    font-size: 12px;
  }
  .comment-card {
    background: #f4f2f0;
    border: 1px solid #f0eeeb;
    margin: 0 0 16px;
    padding: 14px 14px 12px;
    position: relative;
    color: #3f454a;
    font-size: 13px;
    line-height: 1.43;
  }
  .comment-card.nested { margin-left: 48px; background: #fbfaf8; }
  .comment-card h3 { font-size: 18px; margin: 0 0 5px; }
  .comment-type { color: #9a343b; font-weight: bold; }
  .comment-body { margin-top: 6px; }
  .comment-body p { margin: 7px 0; }
  .mini-public { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 12px; color: #777; font-size: 12px; }
  .small-btn { background: #54818e; color: #fff; border: 0; padding: 6px 12px; font-weight: bold; border-radius: 2px; }
  .vote {
    position: absolute;
    left: -24px;
    top: 0;
    width: 17px;
    border: 1px solid #92aeb4;
    color: #608791;
    background: #fff;
    line-height: 14px;
    text-align: center;
    font-size: 10px;
  }
  .paper-page { padding-top: 25px; padding-bottom: 55px; }
  .paper-page .paper-title { padding-right: 60px; }
  .pdf-mark {
    float: right;
    color: #527f8e;
    border: 2px solid #91adb4;
    border-radius: 3px;
    font-size: 12px;
    font-weight: bold;
    padding: 5px 4px;
    margin: 2px 0 0 15px;
  }
  .hidden { display: none !important; }
  .notice {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #293746;
    color: white;
    padding: 12px 20px;
    border-radius: 3px;
    display: none;
    z-index: 10;
  }
  @media (max-width: 700px) {
    .top-inner { gap: 10px; }
    .search { width: 38%; }
    .home-columns { grid-template-columns: 1fr; gap: 28px; }
    .paper-title { font-size: 23px; }
    .tools input, .tools select { width: 46%; }
  }
</style>
</head>
<body>

function metaLine(type, author, date) {
  return `<div class="meta"><span class="comment-type">${type}</span> by ${author} &nbsp; ▣ ${date} &nbsp; ◉ Everyone &nbsp; ▣ Revisions</div>`;
}
function card(title,type,author,date,body,opts='') {
  return `<article class="comment-card ${opts}"><div class="vote">−<br>□<br>+</div><h3>${title}</h3>${metaLine(type,author,date)}<div class="comment-body">${body}</div><div class="mini-public">Add: <button class="small-btn btn" data-notice="Sign in to add a public comment.">Public Comment</button></div></article>`;
}
function renderPaper() {
  currentView = 'paper';
  const decisionBody = `<div class="label">Decision:</div> Accept (Oral)<br><div class="label">Comment:</div>
  <p>This paper contributes the LINGOLY benchmark for evaluating reasoning in LLMs. The benchmark is composed of puzzles from the United Kingdom Linguistics Olympiad (UKLO), which are designed to be solvable with no prior knowledge of the language(s) being tested and are often low-resource languages. Because of this, LINGOLY is from data contamination and memorization to a high degree.</p>
  <p>All reviewers agree this benchmark is executed exceptionally well in terms of addressing data contamination issues as well as offering a diverse set of problems for evaluating reasoning in LLMs. The paper is well executed too, with detailed description of data being clearly presented, including how the data was filtered. The experimental design is solid, covering a representative set of LLMs and interesting analysis is carried out (e.g. in terms of the no-context baselines).</p>
  <p>The main concerns are that the benchmark performance is evaluated in terms of exact string matching, and that the benchmark results are not compared to existing benchmarks (e.g. in terms of a correlation analysis). Another concern is that some of the weaker LLMs might struggle with the multi-lingual format, especially in terms of tokenization. The author's responses adequately address these raised concerns and several reviewers have increased their scores in response.</p>
  <p>Aside from the above, because of the work that went into creating this benchmark and making it publicly available, and because of the general utility it provides for evaluating reasoning in LLMs, I recommend that this paper receives an oral presentation to raise further awareness.</p>`;
  const rebuttalBody = `<div class="label">Rebuttal:</div><strong>LingOly is now available on Eleuther's LM Harness!</strong>
  <p>We mentioned in a few of the rebuttals that we had nearly finished integration with the LM harness to facilitate wider use of this benchmark. As of yesterday, the benchmark is now available as a task that can run both headline metrics in a single command for any model that the harness supports: &nbsp;<span class="label">lm-eval --model xx --model_args yy --tasks lingoly</span></p>
  <p>Thank you to everyone for the positive reviews, and we hope you'll try out the benchmark yourself!</p>`;
  const reviewBody = `<div class="label">Summary And Contributions:</div>
  The authors contribute a linguistic reasoning dataset in low-resource and extinct languages, drawn from the UK linguistics olympiad. They apply 11 advanced large language models to the dataset and analyze their performance, and so that closed models tend to outperform open models, especially on rather simple problems.
  <p><span class="label">Review:</span><br>This was an exemplary paper. The authors explain the rational for choosing the domain linguistic reasoning over low-resource and extinct languages, and for including and excluding specific examples. They test a solid set of baseline models on the dataset--which includes testing for data contamination by removing context--and their analysis is quantitative and qualitative. Overall, this is a strong paper.</p>
  <p><span class="label">Strengths:</span><br>The writing of the paper and the results are both well-explained and solid.</p>
  <p><span class="label">Rating:</span> 9: Top 15% of accepted papers, strong accept<br><span class="label">Opportunities For Improvement:</span><br>My biggest concern with the paper is, though I understand the rationale for choosing this domain, from the perspective of reducing the possible data contamination. I'm not convinced that solving language problems posed to people who don't know the language is an informative domain for testing how LLMs might perform in the field.</p>

  const urgentBody = `<div class="label">Comment:</div><p>Dear Reviewer,</p><p>The author-reviewer discussion period is ending imminently. Please respond to the authors' rebuttal ASAP and confirm that you have read their response.</p><p>Thank you, AC</p>`;
  const replyBody = `<div class="label">Rebuttal:</div><p>Thank you very much for your feedback! We appreciate your strong rating and confidence in the quality of our results.</p><p>We definitely understand your concern about the generalisability of linguistic problem solving as a task. As you note, we chose linguistic problems for partly practical reasons regarding contamination, but we do think that skills being tested would transfer to a wide range of contexts.</p>`;
  app.innerHTML = `${navBar('<a class="btn" href="#" data-view="track">NeurIPS 2024 Datasets and Benchmarks Track</a>')}
  <main class="container paper-page">

    <div class="authors" style="font-style:italic;font-size:16px;margin:7px 0">Andrew Michael Bean, Simeon Hellsten, Harry Mayne, Jabez Magomere, Ethan A Chi, Ryan Andrew Chi, Scott A. Hale, Hannah Rose Kirk</div>
    <div class="meta">▣ Published: 26 Sept 2024, Last Modified: 13 Nov 2024 &nbsp; ▣ NeurIPS 2024 Track Datasets and Benchmarks Oral &nbsp; ◉ Everyone &nbsp; ▣ Revisions &nbsp; ▣ BibTeX &nbsp; © CC BY-NC 4.0</div>
    <div class="paper-abstract">
      <p><span class="label">Keywords:</span> reasoning, language models, benchmark, linguistics</p>
      <p><span class="label">TL;DR:</span> We introduce a difficult reasoning benchmark for language models based on linguistic olympiad problems.</p>
      <p><span class="label">Abstract:</span><br>In this paper, we present the LingOly benchmark, a novel benchmark for advanced reasoning abilities in large language models. Using challenging Linguistic Olympiad puzzles, we evaluate the capabilities for in-context identification and generalisation of linguistic patterns in very low-resource or extinct languages, and (i) abilities to follow complex task instructions. The LingOly benchmark covers more than 90 mostly low-resource languages, minimising issues of data contamination, and contains 1,133 problems across 6 formats and 5 levels of human difficulty. We assess performance with both direct accuracy and comparison to a no-context baseline per language and format. Scores from 11 state-of-the-art LLMs demonstrate the benchmark to be challenging, and models perform poorly on the higher difficulty problems. On harder problems, even the top model only achieved 38.7% accuracy, a 24.7% improvement over the no-context baseline. Large closed models typically outperform open models, and in general, the higher resource the language, the better the scores. These results indicate, in absence of memorisation, true multi-step out-of-domain reasoning remains a challenge for current language models.</p>

function showNotice(text) {
  const n = document.getElementById('notice');
  n.textContent = text;
  n.style.display = 'block';
  clearTimeout(window.noticeTimer);
  window.noticeTimer = setTimeout(() => n.style.display = 'none', 2200);
}
function navigate(view) {
  if (view === 'home') renderHome();
  else if (view === 'venue') renderVenue();
  else if (view === 'year') renderYear();
  else if (view === 'track') renderTrack();
  else if (view === 'paper') renderPaper();
  window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const target = e.target.closest('.btn');
  if (!target) return;
  e.preventDefault();
  if (target.dataset.notice) { showNotice(target.dataset.notice); return; }
  if (target.dataset.view) { navigate(target.dataset.view); return; }
  if (target.classList.contains('tab')) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    target.classList.add('active');
  }
});
renderHome();
