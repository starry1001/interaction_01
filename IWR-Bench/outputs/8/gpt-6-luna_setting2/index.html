<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Missing Dice — Roll a D8</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #f7f5f2;
    color: #111;
    font-family: "Courier New", Courier, monospace;
  }

  body {
    overflow-y: scroll;
  }

  .btn {
    cursor: pointer;
  }

  header {
    height: 76px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px 0 10px;
    background: #eee9e4;
    border-bottom: 1px dotted #c9c2ba;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 20px;
    text-decoration: none;
    color: #111;
  }

  .brand img {
    display: block;
    width: 45px;
    height: 45px;
    object-fit: cover;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
    height: 100%;
  }

  .coffee {
    color: #111;
    font-size: 17px;
    text-decoration: underline;
    text-decoration-style: dotted;
  }

  .modes {
    height: 68px;
    min-width: 175px;
    padding: 0 8px 0 16px;
    border: 1px solid #d0c5bc;
    background: #f2ede8;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: bold;
    font-size: 16px;
  }

  .down {
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 50%;
    background: #b9dbe7;
    font-size: 22px;
    line-height: 24px;
    font-family: Arial, sans-serif;
  }

  .intro {
    height: 230px;
    padding-top: 32px;
    display: flex;
    justify-content: center;
  }

  .intro-inner {
    width: 640px;
  }

  h1 {
    display: inline-block;
    margin: 0 0 20px 0;
    padding: 10px 16px 7px;
    background: #fff;
    font-size: 38px;
    line-height: 1;
    letter-spacing: -2px;
  }

  .intro p {
    width: max-content;
    max-width: 100%;
    margin: 0 0 15px 0;
    padding: 4px 7px;
    background: #fff;
    font-size: 17px;
    line-height: 1.05;
  }

  .intro a {
    color: #111;
    text-decoration: underline;
    text-decoration-style: dotted;
  }

  .striped {
    background:
      repeating-linear-gradient(
        135deg,
        rgba(111, 104, 96, .055) 0,
        rgba(111, 104, 96, .055) 2px,
        transparent 2px,
        transparent 5px
      ),
      #f5f2ee;
  }

  .control-band {
    height: 145px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .control {
    width: 640px;
    height: 74px;
    border: 1px solid #c9bdb2;
    border-radius: 4px;
    background: #f5efeb;
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 11px;
    font-size: 16px;
  }

  .stepper {
    display: flex;
    height: 49px;
    border-radius: 4px;
    overflow: hidden;
  }

  .stepper button,
  .stepper output {
    width: 48px;
    height: 49px;
    border: 0;
    border-right: 1px solid #d4d0cb;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 18px "Courier New", monospace;
  }

  .stepper button {
    background: #aed8e7;
  }

  .stepper button:last-child {
    border-right: 0;
    border-left: 1px solid #d4d0cb;
  }

  .stepper output {
    background: #fff;
    width: 69px;
  }

  .dice-area {
    height: 270px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .dice-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 55px;
    width: 100%;
  }

  .die {
    position: relative;
    width: 155px;
    height: 145px;
    clip-path: polygon(50% 0%, 100% 27%, 100% 75%, 50% 100%, 0% 75%, 0% 27%);
    background:
      repeating-linear-gradient(115deg, rgba(160,172,181,.22) 0 1px, transparent 1px 4px),
      #f8fafb;
    filter: drop-shadow(0 0 1px rgba(255,255,255,.9));
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .die::after {
    content: "";
    position: absolute;
    left: 10%;
    top: 9%;
    width: 80%;
    height: 74%;
    clip-path: polygon(50% 0%, 100% 38%, 100% 100%, 0% 100%, 0% 38%);
    background: rgba(255,255,255,.92);
  }

  .die span {
    position: relative;
    z-index: 2;
    font-family: Arial, sans-serif;
    font-size: 50px;
    font-weight: 400;
    margin-top: -1px;
  }

  .total-band {
    height: 90px;
    background: #fff;
    border-top: 1px solid #d8cec5;
    border-bottom: 1px solid #e0d6ce;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .total {
    width: 640px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    background:
      radial-gradient(circle, rgba(224,218,212,.38) 2px, transparent 3px) 0 0 / 11px 11px;
  }

  .action-band {
    height: 126px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .roll {
    width: 640px;
    height: 92px;
    border: 0;
    border-radius: 5px;
    background: #ed8e89;
    color: #111;
    font: bold 25px "Courier New", monospace;
    box-shadow:
      0 5px 0 #c95b57,
      inset 0 -1px 0 rgba(0,0,0,.1);
  }

  button:focus,
  .modes:focus,
  a:focus {
    outline: 2px dashed #4b2db0;
    outline-offset: 2px;
  }

  @media (max-width: 760px) {
    .intro-inner, .control, .total, .roll { width: calc(100% - 32px); }
    .intro { padding-top: 28px; }
    h1 { font-size: 31px; }
    .intro p { font-size: 14px; }
    .control { font-size: 13px; }
    .dice-row { gap: 8px; }
    .die { width: 125px; height: 120px; }
    .die span { font-size: 42px; }
  }
</style>
</head>
<body>
<header>
  <a class="brand btn" href="#" aria-label="Missing Dice home">
    <img src="../../../data/data/8/assets/004.png" width="45" height="45" alt="Missing Dice logo">
    <span>Missing Dice</span>
  </a>
  <div class="header-right">
    <a class="coffee btn" href="#">Buy me a coffee</a>
    <button class="modes btn" type="button" aria-label="Color modes">
      <span>Color modes</span>
      <span class="down">⌄</span>
    </button>
  </div>
</header>

<main>
  <section class="intro">
    <div class="intro-inner">
      <h1>Roll a D8</h1>
      <p>Use this too to roll any amount of <b>8-sided dice.</b></p>
      <p>For more options try our <a class="btn" href="#">all-purpose dice roller.</a></p>
    </div>
  </section>

  <section class="control-band striped">
    <div class="control">
      <span>number of 8-sided dice:</span>
      <div class="stepper" aria-label="Number of dice">
        <button class="btn minus" type="button" aria-label="Decrease number of dice">-</button>
        <output id="count">1</output>
        <button class="btn plus" type="button" aria-label="Increase number of dice">+</button>
      </div>
    </div>
  </section>

  <section class="dice-area" id="diceArea">
    <div class="dice-row" id="diceRow"></div>
  </section>

  <section class="total-band">
    <div class="total">TOTAL: <b id="totalValue">7</b></div>
  </section>

  <section class="action-band striped">
    <button class="roll btn" id="rollButton" type="button">ROLL DICE</button>
  </section>
</main>

<script>
  const countOutput = document.getElementById("count");
  const diceRow = document.getElementById("diceRow");
  const totalValue = document.getElementById("totalValue");
  const minus = document.querySelector(".minus");
  const plus = document.querySelector(".plus");
  const rollButton = document.getElementById("rollButton");

  let count = 1;
  let rollIndex = 0;
  let values = [7];

  const sequences = [
    [1, 5, 5, 1],
    [2, 1, 8, 3],
    [1, 7, 8, 6]
  ];

  function renderDice() {
    diceRow.innerHTML = "";
    values.slice(0, count).forEach(value => {
      const die = document.createElement("div");
      die.className = "die";
      const number = document.createElement("span");
      number.textContent = value;
      die.appendChild(number);
      diceRow.appendChild(die);
    });
    countOutput.textContent = count;
    totalValue.textContent = values.slice(0, count).reduce((a, b) => a + b, 0);
  }

  minus.addEventListener("click", () => {
    count = Math.max(1, count - 1);
    if (count === 1 && values.length !== 1) values = [values[0] || 7];
    renderDice();
  });

  plus.addEventListener("click", () => {
    count = Math.min(20, count + 1);
    renderDice();
  });

  rollButton.addEventListener("click", () => {
    if (count === 4) {
      values = sequences[Math.min(rollIndex, sequences.length - 1)];
      rollIndex++;
    } else {
      values = Array.from({length: count}, () => Math.floor(Math.random() * 8) + 1);
    }
    renderDice();
  });

  document.querySelector(".modes").addEventListener("click", () => {
    document.body.classList.toggle("dark-mode");
  });

  renderDice();
</script>
</body>
</html>
