<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Livegap Charts</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#222}
body{background:#c8c8c8}
.btn{cursor:pointer}
.topbar{height:38px;background:#fafafa;border-bottom:1px solid #888;display:flex;align-items:center;padding-left:32px;font-size:15px;letter-spacing:.4px;position:relative;z-index:5}
.menu{margin-right:34px;height:38px;display:flex;align-items:center}
.signin{position:absolute;right:444px;font-size:14px;top:12px}
.workspace{position:absolute;top:38px;bottom:150px;left:0;right:400px;background:#c9c9c9}
.chart-wrap{position:absolute;left:50%;top:77px;transform:translateX(-50%);width:700px}
.chart-card{width:700px;height:420px;background:white;border:1px solid #aaa;box-shadow:0 1px 3px #888}
.chart-svg{width:700px;height:420px;display:block}
.try-pill{position:absolute;top:425px;left:256px;border:1px solid #3694ca;border-radius:18px;height:36px;padding:8px 10px;background:#eee;font-size:14px;color:#333;box-shadow:0 1px 2px #777}
.try-pill b{font-size:14px}
.new{background:#ed3e52;color:white;border-radius:12px;padding:3px 6px;font-size:11px;margin-left:8px}
.floating{position:absolute;top:464px;left:323px;width:58px;height:58px;background:#167bd4;border-radius:50%;box-shadow:0 2px 4px #888}
.sidebar{position:absolute;top:0;right:0;width:400px;bottom:0;background:#3c9fd0;padding-top:29px;overflow-y:auto}
.logo{display:block;margin:0 auto 27px;width:184px;height:78px;object-fit:contain}
.panel{margin:0 0 0 10px;width:390px;background:#fff;border-radius:5px 0 0 0;overflow:hidden}
.section{height:50px;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 7px;font-size:16px;background:#fff}
.section.active{background:#333;color:#fff;height:53px;justify-content:center;font-size:17px}
.point-options{background:#eee;padding:10px 12px 14px;border-bottom:8px solid #3c9fd0}
.switch{display:inline-block;width:39px;height:17px;background:#ddd;border-radius:10px;vertical-align:middle;margin-right:13px;position:relative}
.switch:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;right:-1px;top:-2px;box-shadow:0 1px 2px #888}
.option-box{border:1px solid #aaa;border-radius:4px;height:50px;margin:0 0 12px;padding:12px 18px;font-size:15px;background:#f5f5f5}
.range-row{height:43px;display:flex;align-items:center;font-size:16px}
.range{height:4px;background:#8bc5ed;flex:1;margin-left:14px;position:relative}
.range:before{content:"";position:absolute;width:13px;height:13px;background:#2588d5;border-radius:50%;left:0;top:-5px}
.data-area{position:absolute;left:0;right:0;bottom:0;height:150px;background:#f5f6fa;border-top:1px solid #aaa;overflow:hidden}
.data-tab{position:absolute;top:-36px;left:0;width:60px;height:36px;background:#f6f7fa;border-radius:9px 9px 0 0;border-top:1px solid #bbb;border-right:1px solid #bbb;padding:11px 13px;font-size:12px;font-weight:bold}
table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:16px}
th,td{height:24px;border:1px solid #d1d1d1;text-align:center;padding:2px;background:#fafafa}
th{height:32px;font-weight:bold;background:#f1f3f8}
th:first-child,td:first-child{width:202px;background:#eef0f6;font-weight:bold}
td[contenteditable="true"]{outline:none}
td.selected{box-shadow:inset 0 0 0 2px #4d91df;background:#fff}
.note{font-size:12px}
</style>
</head>
<body>
<div class="topbar">
  <div class="menu btn">FILE</div><div class="menu btn">EDIT</div><div class="menu btn">DATA</div>
  <div class="menu btn">VIEW</div><div class="menu btn">LANGUAGE</div><div class="menu btn">HELP</div>
  <div class="signin btn">SIGN IN</div>
</div>

<div class="workspace">
  <div class="chart-wrap">
    <div class="chart-card">
      <svg class="chart-svg" viewBox="0 0 700 420" aria-label="chart">
        <rect x="0" y="0" width="700" height="420" fill="#fff"/>
        <text x="350" y="39" text-anchor="middle" font-size="28" fill="#4da1d4">Chart Title</text>
        <text x="350" y="68" text-anchor="middle" font-size="17" fill="#777">Add SubTitle Here</text>
        <g id="grid"></g>
        <g font-size="13" fill="#222">
          <text x="40" y="110">100</text><text x="40" y="132">90</text><text x="40" y="154">80</text>
          <text x="40" y="176">70</text><text x="40" y="198">60</text><text x="40" y="220">50</text>
          <text x="40" y="242">40</text><text x="40" y="264">30</text><text x="40" y="286">20</text>
          <text x="40" y="308">10</text>
        </g>
        <g id="chartPaths">
          <path id="blueArea" fill="#83c0e3" fill-opacity=".62" stroke="#3699d2" stroke-width="2"/>
          <path id="greenArea" fill="#6de09a" fill-opacity=".68" stroke="#38cc70" stroke-width="2"/>
        </g>
        <g id="labels" font-size="13" font-style="italic" fill="#333"></g>
        <g id="dots"></g>
        <g font-size="13" fill="#333">
          <text x="61" y="328" text-anchor="middle">January</text><text x="162" y="328" text-anchor="middle">February</text>
          <text x="263" y="328" text-anchor="middle">March</text><text x="364" y="328" text-anchor="middle">April</text>
          <text x="465" y="328" text-anchor="middle">May</text><text x="566" y="328" text-anchor="middle">June</text>
          <text x="667" y="328" text-anchor="middle">July</text>
        </g>
        <g font-size="16">
          <rect x="291" y="363" width="16" height="16" fill="#75e59d" stroke="#32c76a"/><text x="313" y="377">2024</text>
          <rect x="355" y="363" width="16" height="16" fill="#9dcee9" stroke="#3699d2"/><text x="377" y="377">2023</text>
        </g>
        <text x="350" y="402" text-anchor="middle" font-size="13" fill="#555">Made with Livegap Charts</text>
      </svg>
    </div>
    <div class="try-pill btn">Try <b>code.livegap.com</b><span class="new">New</span></div>
    <div class="floating btn"></div>
  </div>
</div>

<aside class="sidebar">
  <img class="logo" src="../../../data/data/46/assets/010.png" width="184" height="78" alt="Livegap Charts">
  <div class="panel">
    <div class="section btn">Chart</div>
    <div class="section btn">Colors</div>
    <div class="section btn">inGraph Data</div>
    <div class="section btn">Legend</div>
    <div class="section btn">DataSet</div>
    <div class="section point-toggle btn">Point Dot</div>
    <div class="point-options" id="pointOptions" style="display:none">
      <div style="text-align:center;margin:2px 0 14px"><span class="switch btn"></span>Point Dot</div>
      <div class="option-box"><span style="display:inline-block;border:1px solid #777;border-radius:50%;width:25px;height:25px;vertical-align:middle;margin-right:8px;background:#fff"></span>circle</div>
      <div class="range-row">Radius <span class="range"></span></div>
      <div class="option-box" style="height:42px;padding-top:10px"><span style="display:block;border-top:1px solid #333"></span></div>
      <div class="range-row">Stroke Width <span class="range"></span></div>
    </div>
    <div class="section btn">Scale</div><div class="section btn">Axis</div><div class="section btn">Grid</div>
    <div class="section btn">Text</div><div class="section btn">Annotations</div><div class="section btn">Animation</div>
    <div class="section btn">Freehand <button class="btn" style="margin-left:12px;border:1px solid #73a8d0;background:#fff;border-radius:4px;color:#3973a0;padding:4px 10px">Pro</button></div>
  </div>
  <img src="../../../data/data/46/assets/007.png" width="140" height="50" alt="Microsoft" style="display:block;margin:73px auto">
</aside>

<div class="data-area">
  <div class="data-tab">DATA</div>
  <table>
    <thead><tr><th></th><th>January</th><th>February</th><th>March</th><th>April</th><th>May</th><th>June</th><th>July</th><th></th><th></th></tr></thead>
    <tbody>
      <tr><td>2023</td><td contenteditable="true" data-r="0" data-c="0">65</td><td contenteditable="true" data-r="0" data-c="1">8</td><td contenteditable="true" data-r="0" data-c="2">90</td><td contenteditable="true" data-r="0" data-c="3">81</td><td contenteditable="true" data-r="0" data-c="4">56</td><td contenteditable="true" data-r="0" data-c="5">55</td><td contenteditable="true" data-r="0" data-c="6">40</td><td></td><td></td></tr>
      <tr><td>2024</td><td contenteditable="true" data-r="1" data-c="0">21</td><td contenteditable="true" data-r="1" data-c="1">48</td><td contenteditable="true" data-r="1" data-c="2">40</td><td contenteditable="true" data-r="1" data-c="3">19</td><td contenteditable="true" data-r="1" data-c="4">96</td><td contenteditable="true" data-r="1" data-c="5">27</td><td contenteditable="true" data-r="1" data-c="6">99</td><td></td><td></td></tr>
      <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
      <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    </tbody>
  </table>
</div>

<script>
const months=["January","February","March","April","May","June","July"];
let values=[[65,8,90,81,56,55,40],[21,48,40,19,96,27,99]];
let showDots=false;
const xs=[61,162,263,364,465,566,667], base=305, scale=2.2;
function smoothPath(vals){
  let p=`M ${xs[0]} ${base-vals[0]*scale}`;
  for(let i=0;i<vals.length-1;i++){
    const x1=xs[i], y1=base-vals[i]*scale, x2=xs[i+1], y2=base-vals[i+1]*scale;
    const mid=(x1+x2)/2;
    p+=` C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`;
  }
  return p+` L ${xs[xs.length-1]} ${base} L ${xs[0]} ${base} Z`;
}
function render(){
  blueArea.setAttribute("d",smoothPath(values[0]));
  greenArea.setAttribute("d",smoothPath(values[1]));
  labels.innerHTML="";
  values.forEach((row,ri)=>row.forEach((v,i)=>{
    const t=document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",xs[i]+(i===0?2:0)); t.setAttribute("y",base-v*scale-7);
    t.setAttribute("text-anchor",i===0?"start":"middle"); t.textContent=v; labels.appendChild(t);
  }));
  dots.innerHTML="";
  if(showDots) values.forEach((row,ri)=>row.forEach((v,i)=>{
    const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",xs[i]);c.setAttribute("cy",base-v*scale);c.setAttribute("r",5);
    c.setAttribute("fill",ri?"#27c86b":"#328fc7");dots.appendChild(c);
  }));
}
function commit(e){
  const cell=e.currentTarget, r=+cell.dataset.r,c=+cell.dataset.c;
  let n=parseFloat(cell.textContent.trim());
  if(!isNaN(n)){n=Math.max(0,Math.min(100,n));values[r][c]=n;cell.textContent=n}
  render();
}
document.querySelectorAll('[contenteditable]').forEach(cell=>{
  cell.addEventListener("focus",()=>cell.classList.add("selected"));
  cell.addEventListener("blur",e=>{e.currentTarget.classList.remove("selected");commit(e)});
  cell.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();e.currentTarget.blur()}});
});
document.querySelector(".point-toggle").addEventListener("click",()=>{
  showDots=!showDots;
  pointOptions.style.display=pointOptions.style.display==="none"?"block":"none";
  render();
});
document.querySelector(".switch").addEventListener("click",()=>{showDots=!showDots;render()});
render();
</script>
</body>
</html>
