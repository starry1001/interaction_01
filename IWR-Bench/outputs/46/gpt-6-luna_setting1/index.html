<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livegap Charts</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, Helvetica, sans-serif; color: #333; }
  :root { --rail: 396px; --bar: 37px; --table: 151px; }
  .topbar {
    position: absolute; inset: 0 var(--rail) auto 0; height: var(--bar);
    background: #f5f5f5; border-bottom: 1px solid #999; display: flex;
    align-items: center; z-index: 5; padding: 0 25px; gap: 32px;
  }
  .topbar button {
    border: 0; padding: 0; background: none; font-size: 14px; letter-spacing: .5px;
    color: #222; font-weight: 600; height: 100%; cursor: pointer;
  }
  .topbar .signin { margin-left: auto; }
  .workspace {
    position: absolute; left: 0; right: var(--rail); top: var(--bar);
    bottom: var(--table); background: #c9c9c9; overflow: hidden;
  }
  .chart-card {
    width: 702px; height: 418px; position: absolute; top: 78px; left: 50%;
    transform: translateX(-50%); background: #fff; border: 1px solid #aaa;
    box-shadow: 0 1px 4px #888; overflow: hidden;
  }
  #chart { display:block; width:100%; height:100%; }
  .code-pill {
    position: absolute; top: 502px; left: 50%; transform: translateX(-50%);
    border: 1px solid #62a5d5; border-radius: 20px; padding: 7px 9px;
    font-size: 14px; line-height: 18px; font-weight: bold; color:#222;
    white-space:nowrap; background:#f2f2f2;
  }
  .code-pill .new { color:white; background:#f04e68; border-radius:9px; padding:2px 7px; margin-left:8px; font-size:11px; }
  .floating {
    position:absolute; top: 545px; left:50%; transform:translateX(-50%);
    width:58px; height:58px; border-radius:50%; border:0; background:#2184d3;
    box-shadow:0 2px 5px #999; cursor:pointer;
  }
  .rail {
    position:absolute; top:0; right:0; width:var(--rail); height:calc(100% - var(--table));
    background:#399dd0; overflow-y:auto; scrollbar-width:thin; scrollbar-color:#888 transparent;
    z-index:3;
  }
  .brand { height:132px; display:flex; align-items:flex-start; justify-content:center; padding-top:30px; }
  .brand img { width:185px; height:80px; object-fit:contain; }
  .sections { margin:0 11px; border-radius:7px; overflow:hidden; box-shadow:0 1px 4px #888; }
  .section-title {
    background:#fff; border:0; border-bottom:1px solid #ddd; width:100%; height:50px;
    display:flex; align-items:center; text-align:left; padding:0 6px; color:#333;
    font-size:16px; cursor:pointer;
  }
  .section-title:hover { background:#fafafa; }
  .section-title.active { background:#333; color:#fff; justify-content:center; font-size:18px; }
  .pro { display:inline-block; border:1px solid #71a6d0; border-radius:4px; color:#5687b1; font-size:12px; padding:3px 11px; margin-left:9px; }
  .point-panel { background:#e7e7e7; padding:10px 10px 15px; display:none; border-bottom:1px solid #ccc; }
  .point-panel.open { display:block; }
  .switch { width:38px; height:18px; display:inline-block; background:#aaa; border-radius:12px; vertical-align:middle; margin-right:10px; position:relative; }
  .switch:after { content:""; position:absolute; width:16px; height:16px; background:#fff; border-radius:50%; left:1px; top:1px; box-shadow:0 1px 2px #555; }
  .switch.on { background:#ccc; }
  .switch.on:after { left:21px; }
  .control-label { font-size:15px; color:#555; margin:4px 0 8px; }
  .shape-box, .stroke-box { border:1px solid #aaa; border-radius:5px; padding:9px 12px; margin-bottom:14px; color:#333; font-size:15px; }
  .shape-box input { appearance:none; border:1.5px solid #555; border-radius:50%; width:24px; height:24px; vertical-align:middle; margin:0 8px 0 0; background:white; }
  .range { width:100%; accent-color:#258bd3; margin:2px 0 17px; }
  .stroke-box { height:42px; padding-top:17px; position:relative; }
  .stroke-box:before { content:"Stroke Style"; position:absolute; background:#e7e7e7; top:-8px; left:8px; color:#666; font-size:12px; padding:0 4px; }
  .stroke-line { border-top:1px solid #333; width:100%; }
  .store { height:168px; display:flex; align-items:center; justify-content:center; }
  .store img { width:138px; height:51px; object-fit:contain; }
  .rail-white { height:180px; background:#fff; }
  .table-wrap {
    position:absolute; left:0; right:0; bottom:0; height:var(--table); background:#f8f8f8;
    border-top:5px solid #bdbdbd; z-index:4; overflow:hidden;
  }
  .data-tab {
    position:absolute; z-index:2; top:-35px; left:0; height:32px; width:60px;
    background:#f7f7f7; border:0; border-radius:7px 7px 0 0; color:#555;
    font-weight:bold; font-size:13px; cursor:pointer;
  }
  table { border-collapse:collapse; table-layout:fixed; width:100%; font-size:16px; }
  th, td { height:25px; border:1px solid #d3d5d9; text-align:center; padding:0; background:#fff; }
  thead th { height:30px; background:#e9eaf0; font-weight:bold; }
  th:first-child, td:first-child { width:202px; background:#e9eaf0; }
  th:not(:first-child), td:not(:first-child) { width:256px; }
  tbody th { font-weight:bold; }
  td.blank { background:#fafafa; }
  td.selected { outline:2px solid #5795f4; outline-offset:-2px; }
  td input { width:100%; height:100%; border:2px solid #5795f4; padding:0 3px; font:inherit; outline:0; }
  .menu-pop {
    display:none; position:absolute; z-index:20; left:20px; top:35px; width:210px;
    background:#fff; box-shadow:0 2px 8px #777; border:1px solid #ccc;
  }
  .menu-pop button { display:block; width:100%; text-align:left; height:35px; padding:0 12px; }
  @media (max-width: 1100px) {
    :root { --rail: 300px; }
    .chart-card { width:min(702px, 90%); }
    th:first-child, td:first-child { width:120px; }
    th:not(:first-child), td:not(:first-child) { width:180px; }
  }
</style>
</head>
<body>
<nav class="topbar">
  <button class="btn menu-btn">FILE</button>
  <button class="btn menu-btn">EDIT</button>
  <button class="btn menu-btn">DATA</button>
  <button class="btn menu-btn">VIEW</button>
  <button class="btn menu-btn">LANGUAGE</button>
  <button class="btn menu-btn">HELP</button>
  <button class="btn signin">SIGN IN</button>
</nav>
<div class="menu-pop" id="menuPop">
  <button class="btn">New chart</button><button class="btn">Open</button>
  <button class="btn">Save</button><button class="btn">Export chart</button>
</div>
<main class="workspace">
  <div class="chart-card"><svg id="chart" viewBox="0 0 700 416" aria-label="Chart"></svg></div>
  <div class="code-pill">Try code.livegap.com <span class="new">New</span></div>
  <button class="btn floating" aria-label="Create"></button>
</main>
<aside class="rail">
  <div class="brand"><img src="../../../data/data/46/assets/010.png" width="185" height="80" alt="Livegap Charts"></div>
  <div class="sections">
    <button class="btn section-title">Chart</button>
    <button class="btn section-title">Colors</button>
    <button class="btn section-title">inGraph Data</button>
    <button class="btn section-title">Legend</button>
    <button class="btn section-title">DataSet</button>
    <button class="btn section-title active" id="pointHeader"><span class="switch on"></span>Point Dot</button>
    <div class="point-panel open" id="pointPanel">
      <div class="control-label">Shape</div>
      <div class="shape-box"><input type="radio" checked aria-label="circle">circle</div>
      <div class="control-label">Radius <input class="range" type="range" min="1" max="12" value="3"></div>
      <div class="stroke-box"><div class="stroke-line"></div></div>
      <div class="control-label">Stroke Width <input class="range" type="range" min="0" max="8" value="1"></div>
    </div>
    <button class="btn section-title">Scale</button>
    <button class="btn section-title">Axis</button>
    <button class="btn section-title">Grid</button>
    <button class="btn section-title">Text</button>
    <button class="btn section-title">Annotations</button>
    <button class="btn section-title">Animation</button>
    <button class="btn section-title">Freehand <span class="pro">Pro</span></button>
  </div>
  <div class="store"><img src="../../../data/data/46/assets/007.png" width="138" height="51" alt="Get it from Microsoft"></div>
  <div class="rail-white"></div>
</aside>
<div class="table-wrap">
  <button class="btn data-tab">DATA</button>
  <table id="dataTable">
    <thead><tr><th></th><th>January</th><th>February</th><th>March</th><th>April</th><th>May</th><th>June</th><th>July</th><th></th><th></th></tr></thead>
    <tbody>
      <tr><th>2023</th><td data-series="0" data-index="0">65</td><td data-series="0" data-index="1">8</td><td data-series="0" data-index="2">90</td><td data-series="0" data-index="3">81</td><td data-series="0" data-index="4">56</td><td data-series="0" data-index="5">55</td><td data-series="0" data-index="6">40</td><td class="blank"></td><td class="blank"></td></tr>
      <tr><th>2024</th><td data-series="1" data-index="0">21</td><td data-series="1" data-index="1">48</td><td data-series="1" data-index="2">40</td><td data-series="1" data-index="3">19</td><td data-series="1" data-index="4">96</td><td data-series="1" data-index="5">27</td><td data-series="1" data-index="6">99</td><td class="blank"></td><td class="blank"></td></tr>
      <tr><th></th><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
      <tr><th></th><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    </tbody>
  </table>
</div>
<script>
(() => {
  const months = ["January","February","March","April","May","June","July"];
  const values = [[65,8,90,81,56,55,40],[21,48,40,19,96,27,99]];
  const colors = [
    { line:"#399bd2", fill:"rgba(78,169,218,.43)" },
    { line:"#23d66a", fill:"rgba(45,211,133,.54)" }
  ];
  const svg = document.getElementById("chart");
  const NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs={}, text="") {
    const n=document.createElementNS(NS,tag);
    Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));
    if(text) n.textContent=text;
    return n;
  }
  function smoothPath(points) {
    let d=`M ${points[0][0]} ${points[0][1]}`;
    for(let i=0;i<points.length-1;i++){
      const p0=points[Math.max(0,i-1)], p1=points[i], p2=points[i+1], p3=points[Math.min(points.length-1,i+2)];
      const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
      const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
      d+=` C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2[0]} ${p2[1]}`;
    }
    return d;
  }
  function drawChart(){
    svg.innerHTML="";
    svg.appendChild(el("rect",{x:0,y:0,width:700,height:416,fill:"#fff"}));
    svg.appendChild(el("text",{x:350,y:39,"text-anchor":"middle","font-size":27,fill:"#4f9ece"},"Chart Title"));
    svg.appendChild(el("text",{x:350,y:68,"text-anchor":"middle","font-size":17,fill:"#666"},"Add SubTitle Here"));
    const left=47,right=653,top=83,bottom=306;
    for(let v=0;v<=100;v+=10){
      const y=bottom-(v/100)*(bottom-top);
      svg.appendChild(el("line",{x1:left,y1:y,x2:right,y2:y,stroke:v===0?"#333":"#e4e4e4","stroke-width":v===0?1.2:1}));
      svg.appendChild(el("text",{x:39,y:y+4,"text-anchor":"end","font-size":12,fill:"#444"},String(v)));
    }
    const xs=months.map((_,i)=>left+i*(right-left)/6);
    xs.forEach((x,i)=>{
      svg.appendChild(el("line",{x1:x,y1:top,x2:x,y2:bottom,stroke:"#e7e7e7","stroke-width":1}));
      svg.appendChild(el("text",{x,y:328,"text-anchor":"middle","font-size":13,fill:"#222"},months[i]));
    });
    // Draw 2023 first so that the green series sits visibly above it.
    [0,1].forEach(series=>{
      const pts=values[series].map((v,i)=>[xs[i],bottom-(Math.max(0,Math.min(100,v))/100)*(bottom-top)]);
      const curve=smoothPath(pts);
      const area=curve+` L ${right} ${bottom} L ${left} ${bottom} Z`;
      svg.appendChild(el("path",{d:area,fill:colors[series].fill,stroke:"none"}));
      svg.appendChild(el("path",{d:curve,fill:"none",stroke:colors[series].line,"stroke-width":2.5}));
      pts.forEach((p,i)=>{
        svg.appendChild(el("text",{x:p[0],y:p[1]-7,"text-anchor":"middle","font-size":12,"font-style":"italic",fill:"#333"},String(values[series][i])));
      });
    });
    // legend
    svg.appendChild(el("rect",{x:288,y:363,width:16,height:16,fill:"rgba(45,211,133,.3)",stroke:"#25d76a","stroke-width":2}));
    svg.appendChild(el("text",{x:309,y:376,"font-size":16,fill:"#333"},"2024"));
    svg.appendChild(el("rect",{x:352,y:363,width:16,height:16,fill:"rgba(78,169,218,.3)",stroke:"#399bd2","stroke-width":2}));
    svg.appendChild(el("text",{x:373,y:376,"font-size":16,fill:"#333"},"2023"));
    svg.appendChild(el("text",{x:350,y:400,"text-anchor":"middle","font-size":13,fill:"#555"},"Made with Livegap Charts"));
  }
  drawChart();
  document.querySelectorAll("td[data-series]").forEach(cell=>{
    cell.addEventListener("click",()=>{
      if(cell.querySelector("input")) return;
      document.querySelectorAll("td.selected").forEach(x=>x.classList.remove("selected"));
      cell.classList.add("selected");
      const input=document.createElement("input");
      input.value=cell.textContent.trim();
      cell.textContent="";
      cell.appendChild(input);
      input.focus(); input.select();
      const finish=()=>{
        const s=Number(cell.dataset.series), i=Number(cell.dataset.index);
        const raw=input.value.trim();
        const num=Number(raw);
        if(raw!=="" && Number.isFinite(num)) values[s][i]=num;
        cell.textContent=raw || String(values[s][i]);
        cell.classList.remove("selected");
        drawChart();
      };
      input.addEventListener("blur",finish,{once:true});
      input.addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault();input.blur();} if(e.key==="Escape"){input.value=String(values[Number(cell.dataset.series)][Number(cell.dataset.index)]);input.blur();} });
    });
  });
  document.getElementById("pointHeader").addEventListener("click",()=>{
    const panel=document.getElementById("pointPanel");
    panel.classList.toggle("open");
    document.getElementById("pointHeader").classList.toggle("active");
  });
  document.querySelectorAll(".section-title:not(#pointHeader)").forEach(button=>{
    button.addEventListener("click",()=>{
      document.querySelectorAll(".section-title").forEach(b=>{if(b!==button)b.classList.remove("active");});
      button.classList.toggle("active");
    });
  });
  document.querySelectorAll(".menu-btn").forEach(btn=>btn.addEventListener("click",()=>{
    const pop=document.getElementById("menuPop");
    pop.style.display=pop.style.display==="block"?"none":"block";
    pop.style.left=Math.max(0,btn.offsetLeft)+"px";
  }));
  document.querySelector(".data-tab").addEventListener("click",()=>{
    document.querySelector(".table-wrap").classList.toggle("collapsed");
    const t=document.querySelector(".table-wrap");
    t.style.height=t.classList.contains("collapsed")?"34px":"var(--table)";
  });
  document.querySelector(".floating").addEventListener("click",()=>{});
})();
</script>
</body>
</html>
