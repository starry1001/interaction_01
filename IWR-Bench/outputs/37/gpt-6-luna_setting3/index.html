<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Game</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: #f0f1f4;
    color: #161c23;
    font-family: Arial, Helvetica, sans-serif;
  }
  .site {
    position: relative;
    width: 100%;
    max-width: 1280px;
    min-height: 968px;
    margin: 0 auto;
    background: #faf9fc;
    border-left: 1px solid #e4e5e8;
    border-right: 1px solid #e4e5e8;
  }
  .topbar {
    height: 80px;
    width: 100%;
    background: #f0f1f4;
    border-bottom: 1px solid #dedfe3;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .top-left, .top-right {
    position: absolute;
    top: 0;
    height: 79px;
    display: flex;
    align-items: center;
    gap: 14px;
    color: #111820;
  }
  .top-left { left: 40px; }
  .top-right { right: 40px; }
  .badge {
    width: 27px;
    height: 33px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
    font-size: 13px;
    background: #ec0757;
    clip-path: polygon(50% 0, 95% 25%, 95% 76%, 50% 100%, 5% 76%, 5% 25%);
    text-shadow: 0 1px 1px #92103c;
  }
  .tiny-knight { font-size: 24px; color: #080d12; line-height: 1; }
  .flag { font-size: 18px; }
  .players {
    display: flex;
    align-items: center;
    height: 76px;
    gap: 8px;
  }
  .player {
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .player:first-child { flex-direction: row-reverse; text-align: right; }
  .player-name { font-size: 20px; line-height: 24px; }
  .clock { font-size: 14px; color: #535a62; margin-top: 2px; }
  .clock.pink { color: #bd3d75; }
  .avatar {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    border: 7px solid #21c69e;
    overflow: hidden;
    background: #26363d;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .avatar.bot { border-color: #20c79f; background: #243844; }
  .avatar.bot img { object-fit: contain; padding: 3px; }
  .score {
    font-size: 27px;
    font-weight: bold;
    color: #48525a;
    letter-spacing: 2px;
    margin: 0 0 1px;
  }
  .game { position: relative; min-height: 888px; padding-top: 56px; }
  .capture-note {
    position: absolute;
    top: 10px;
    width: 100%;
    text-align: center;
    height: 36px;
    font-size: 17px;
    color: #111820;
  }
  .capture-note span { vertical-align: middle; }
  .mini-piece {
    font-family: "DejaVu Sans", "Segoe UI Symbol", serif;
    font-size: 30px;
    vertical-align: -3px;
  }
  .board {
    width: min(746px, calc(100vw - 80px));
    aspect-ratio: 1;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    user-select: none;
    touch-action: none;
    overflow: hidden;
  }
  .square {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
  }
  .light { background: #adf4df; }
  .dark { background: #20c69d; }
  .square.last { background: #cdbb9f; }
  .square.selected { background: #a99a7d; }
  .square.legal::after {
    content: "";
    position: absolute;
    width: 34%;
    height: 34%;
    border-radius: 50%;
    background: rgba(0, 87, 70, .36);
    pointer-events: none;
  }
  .square.legal.occupied::after {
    width: 84%;
    height: 84%;
    background: transparent;
    border: 5px solid rgba(0, 87, 70, .38);
  }
  .piece {
    position: relative;
    z-index: 1;
    font-family: "DejaVu Sans", "Segoe UI Symbol", "Arial Unicode MS", serif;
    line-height: 1;
    font-size: clamp(45px, 7.1vw, 77px);
    transform: translateY(-1px);
    cursor: grab;
  }
  .piece.white {
    color: #fff;
    -webkit-text-stroke: 1.8px #050505;
    text-shadow: 1px 2px 0 #050505, -1px -1px 0 #050505;
  }
  .piece.black { color: #050505; }
  .rank, .file {
    position: absolute;
    z-index: 2;
    pointer-events: none;
    color: rgba(0, 127, 99, .66);
    font-family: Georgia, serif;
    font-size: 20px;
    line-height: 1;
  }
  .rank { left: 5px; top: 3px; }
  .file { right: 5px; bottom: 3px; }
  .game-footer {
    height: 55px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 16px;
    gap: 1px;
    color: #15191d;
  }
  .footer-piece {
    font-family: "DejaVu Sans", "Segoe UI Symbol", serif;
    font-size: 27px;
    line-height: 1;
  }
  .remove-ads {
    position: fixed;
    top: 49.5%;
    color: #929292;
    text-decoration: underline;
    font-family: Georgia, serif;
    font-size: 16px;
    cursor: pointer;
  }
  .remove-ads.left { left: max(20px, calc((100vw - 1684px) / 2)); }
  .remove-ads.right { right: max(20px, calc((100vw - 1684px) / 2)); }
  .btn { cursor: pointer; }
  @media (max-width: 760px) {
    .site { min-height: 100vh; }
    .top-left { left: 8px; gap: 6px; }
    .top-right { right: 8px; gap: 6px; }
    .top-left .badge, .top-right .badge { width: 21px; height: 27px; font-size: 11px; }
    .players { gap: 4px; }
    .player { gap: 4px; }
    .player-name { font-size: 17px; }
    .clock { font-size: 12px; }
    .avatar { width: 58px; height: 58px; border-width: 6px; }
    .score { font-size: 22px; letter-spacing: 1px; }
    .top-left .flag, .top-right .flag { font-size: 14px; }
    .tiny-knight { font-size: 19px; }
    .game { padding-top: 56px; }
    .remove-ads { display: none; }
  }
</style>
</head>
<body>
<div class="site">
  <header class="topbar">
    <div class="top-left">
      <span class="badge btn" title="Level">3</span>
      <span class="tiny-knight btn" title="Chess">♞</span>
      <span class="flag btn" title="United States">🇺🇸</span>
    </div>
    <div class="players">
      <div class="player">
        <div class="avatar btn" title="Roxy">
          <img src="../../../data/data/37/assets/011.svg" width="54" height="54" alt="Roxy avatar">
        </div>
        <div>
          <div class="player-name">ROXY</div>
          <div class="clock pink" id="whiteClock">6.9s</div>
        </div>
      </div>
      <div class="score">0 0</div>
      <div class="player">
        <div class="avatar bot btn" title="Julien Song">
          <img src="../../../data/data/37/assets/024.png" width="48" height="48" alt="Bot avatar">
        </div>
        <div>
          <div class="player-name">Julien Song</div>
          <div class="clock" id="blackClock">1.0s</div>
        </div>
      </div>
    </div>
    <div class="top-right">
      <span class="flag btn" title="France">🇫🇷</span>
      <span class="tiny-knight btn" title="Chess">♘</span>
      <span class="badge btn" title="Rating">133</span>
    </div>
  </header>
  <main class="game">
    <div class="capture-note" id="captureNote"></div>
    <div class="board" id="board" aria-label="Chess board"></div>
    <div class="game-footer" id="gameFooter"></div>
  </main>
</div>
<a class="remove-ads left btn">Remove ads</a>
<a class="remove-ads right btn">Remove ads</a>
<script>
(() => {
  const boardEl = document.getElementById('board');
  const note = document.getElementById('captureNote');
  const footer = document.getElementById('gameFooter');
  const files = ['h','g','f','e','d','c','b','a'];
  const glyph = {
    wk:'♔', wq:'♕', wr:'♖', wb:'♗', wn:'♘', wp:'♙',
    bk:'♚', bq:'♛', br:'♜', bb:'♝', bn:'♞', bp:'♟'
  };
  const board = Array.from({length:8}, () => Array(8).fill(null));
  // White's knight has already developed to the third rank.
  ['wr',null,'wb','wk','wq','wb',null,'wr'].forEach((p,c) => board[0][c]=p);
  ['wp','wp','wp','wp','wp','wp','wp','wp'].forEach((p,c) => board[1][c]=p);
  board[2][2] = 'wn';
  ['bp','bp','bp','bp','bp','bp','bp','bp'].forEach((p,c) => board[6][c]=p);
  ['br','bn','bb','bk','bq','bb','bn','br'].forEach((p,c) => board[7][c]=p);

  let selected = null;
  let previous = [[2,2],[2,2]];
  let legal = [];
  let captures = 0;
  let moveCount = 0;

  function squareClass(r,c) {
    let cls = 'square ' + ((r+c)%2 ? 'dark' : 'light');
    if (previous.some(([pr,pc]) => pr===r && pc===c) && moveCount) cls += ' last';
    if (selected && selected[0]===r && selected[1]===c) cls += ' selected';
    if (legal.some(([lr,lc]) => lr===r && lc===c)) cls += ' legal' + (board[r][c] ? ' occupied' : '');
    return cls;
  }
  function render() {
    boardEl.innerHTML = '';
    for (let r=0; r<8; r++) {
      for (let c=0; c<8; c++) {
        const sq = document.createElement('div');
        sq.className = squareClass(r,c);
        sq.dataset.r = r; sq.dataset.c = c;
        if (c===0) {
          const rank = document.createElement('span');
          rank.className = 'rank';
          rank.textContent = String(r+1);
          sq.appendChild(rank);
        }
        const p = board[r][c];
        if (p) {
          const piece = document.createElement('span');
          piece.className = 'piece ' + (p[0]==='w' ? 'white' : 'black');
          piece.textContent = glyph[p];
          piece.draggable = true;
          piece.addEventListener('dragstart', e => {
            selected = [r,c]; legal = [];
            e.dataTransfer.setData('text/plain', `${r},${c}`);
            setTimeout(render, 0);
          });
          sq.appendChild(piece);
        }
        if (r===7) {
          const file = document.createElement('span');
          file.className = 'file';
          file.textContent = files[c];
          sq.appendChild(file);
        }
        sq.addEventListener('click', () => clickSquare(r,c));
        sq.addEventListener('dragover', e => e.preventDefault());
        sq.addEventListener('drop', e => {
          e.preventDefault();
          const from = (e.dataTransfer.getData('text/plain') || '').split(',').map(Number);
          if (from.length===2 && !Number.isNaN(from[0])) makeMove(from[0],from[1],r,c);
        });
        boardEl.appendChild(sq);
      }
    }
  }
  function clickSquare(r,c) {
    if (selected && selected[0]===r && selected[1]===c) {
      selected = null; legal=[]; render(); return;
    }
    if (selected && board[selected[0]][selected[1]]) {
      if (board[r][c] && board[r][c][0]===board[selected[0]][selected[1]][0]) {
        selected=[r,c]; legal=[]; render(); return;
      }
      makeMove(selected[0],selected[1],r,c);
      return;
    }
    if (board[r][c]) {
      selected=[r,c];
      legal = [[Math.max(0,r-1),c],[Math.min(7,r+1),c],[r,Math.max(0,c-1)],[r,Math.min(7,c+1)]]
        .filter(([rr,cc]) => rr!==r || cc!==c);
      render();
    }
  }
  function makeMove(fr,fc,tr,tc) {
    if (!board[fr][fc] || (fr===tr && fc===tc)) return;
    const taken = board[tr][tc];
    board[tr][tc] = board[fr][fc];
    board[fr][fc] = null;
    previous = [[fr,fc],[tr,tc]];
    moveCount++;
    if (taken) {
      captures++;
      note.innerHTML = `<span class="mini-piece">${glyph[taken]}</span> +${captures}`;
      footer.innerHTML = `<span class="footer-piece">♙</span> +${captures}`;
    } else {
      note.innerHTML = '';
      footer.innerHTML = captures ? `<span class="footer-piece">♙</span> ${captures}` : '';
    }
    selected=null; legal=[];
    render();
  }
  render();
})();
</script>
</body>
</html>
