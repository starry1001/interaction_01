<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desmos Calculator</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;color:#333;background:#fff}
.topbar{height:52px;background:#f5f5f5;border-bottom:1px solid #ddd;box-shadow:0 1px 5px #ddd;display:flex;align-items:center;padding:0 16px;color:#666}
.logo{font-size:31px;letter-spacing:-2px;color:#777;font-weight:300}
.nav{margin-left:auto;display:flex;align-items:center;gap:25px;font-size:16px}
.nav span{white-space:nowrap}
.nav .drop:after{content:"";display:inline-block;margin-left:5px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid #777;vertical-align:middle}
.nav button{font-size:16px;height:40px;padding:0 13px;border:1px solid #ccc;background:#fafafa;color:#666}
.nav .signup{background:#2878d7;border-color:#246fc5;color:#fff}
.icon{font-size:20px;color:#777}
.workspace{position:absolute;left:50%;top:366px;transform:translateX(-50%);width:600px}
.graph{height:298px;border:1px solid #d8d8d8;background:#fff}
.rows{border-left:1px solid #d8d8d8;border-right:1px solid #d8d8d8}
.row{height:58px;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 17px;font-family:Georgia,"Times New Roman",serif;font-size:21px;position:relative}
.row .answer{margin-left:auto;font-size:20px}
.active{height:58px;border:2px solid #4b86d7;background:#fff;display:flex;align-items:center;padding:0 17px;font-family:Georgia,"Times New Roman",serif;font-size:21px;position:relative}
.active.error{border-color:#4b86d7}
.caret{display:inline-block;width:1px;height:25px;background:#222;margin-left:2px;vertical-align:middle}
.warning{position:absolute;right:12px;color:#df6c40;font-family:Arial;font-size:25px}
.keypad{height:217px;background:#f6f6f6;border:1px solid #ddd;border-top:0;padding:8px 6px;display:grid;grid-template-columns:177px 237px 1fr;column-gap:7px}
.leftkeys,.numkeys,.rightkeys{display:grid;gap:5px}
.leftkeys{grid-template-columns:repeat(3,1fr);grid-template-rows:31px repeat(4,38px)}
.numkeys{grid-template-columns:repeat(4,1fr);grid-template-rows:31px repeat(4,38px)}
.rightkeys{grid-template-columns:repeat(2,1fr);grid-template-rows:31px 38px 38px 38px}
button.btn{font:16px Arial,Helvetica,sans-serif;color:#222;border:1px solid #ddd;border-radius:2px;background:linear-gradient(#fff,#f8f8f8);cursor:pointer;user-select:none}
button.btn:hover{filter:brightness(.97)}
.tab{border:0!important;background:transparent!important;border-radius:0!important;color:#555!important;font-size:15px!important}
.tab.selected{border-bottom:4px solid #3679d3!important;color:#222!important}
.mode{font-size:14px!important}
.mode.active-mode{background:#e4efff!important;border-color:#82a9df!important;color:#3978bd!important}
.numkeys button{background:linear-gradient(#ddd,#cfcfcf);border-color:#c8c8c8}
.numkeys .op{background:linear-gradient(#fff,#fafafa)}
.rightkeys .enter{grid-column:1/3;background:#2878d8;color:#fff;border-color:#2878d8;font-size:26px}
.rightkeys .wide{grid-column:1/3}
.toolrow{display:flex;align-items:center;justify-content:space-between;padding:0 7px}
.toolrow button{height:31px}
.toolrow .tools{font-size:22px;background:transparent;border:0}
.math{font-family:Georgia,"Times New Roman",serif}
.sup{font-size:.65em;vertical-align:super;position:relative;top:-.12em}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;line-height:1;text-align:center;font-size:.85em;margin:0 2px}
.frac .top{border-bottom:1px solid #333;padding:0 3px 2px}
.frac .bottom{padding-top:2px}
.radical{font-size:1.2em}
.footer{position:fixed;bottom:10px;left:0;right:0;text-align:center;color:#888;font-size:14px}
@media(max-height:900px){
 .workspace{top:27px}
 .topbar{display:none}
 .footer{display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">desmos</div>
  <div class="nav">
    <span class="drop">Math Tools</span>
    <span class="drop">Resources</span>
    <span class="drop">Partnerships</span>
    <button class="btn">Log In</button>
    <button class="btn signup">Sign Up</button>
    <span class="icon btn">◉</span>
    <span class="icon btn">▤</span>
  </div>
</header>

<main class="workspace">
  <div class="graph"></div>
  <div class="rows" id="rows"></div>
  <div class="active" id="active"><span id="expression"></span><span class="caret"></span><span class="warning" id="warning"></span></div>

  <section class="keypad">
    <div class="leftkeys">
      <div class="toolrow" style="grid-column:1/4">
        <button class="btn tab selected">main</button>
        <button class="btn tab">abc</button>
        <button class="btn tab">func</button>
      </div>
      <button class="btn math" data-action="square">a<sup>2</sup></button>
      <button class="btn math" data-action="power">a<sup>b</sup></button>
      <button class="btn math" data-action="abs">|a|</button>
      <button class="btn math" data-action="sqrt">√</button>
      <button class="btn math">ⁿ√</button>
      <button class="btn math">π</button>
      <button class="btn math">sin</button>
      <button class="btn math">cos</button>
      <button class="btn math">tan</button>
      <button class="btn math">(</button>
      <button class="btn math">)</button>
      <button class="btn math">,</button>
    </div>

    <div class="numkeys">
      <div class="toolrow" style="grid-column:1/5">
        <button class="btn mode">RAD</button>
        <button class="btn mode active-mode">DEG</button>
        <button class="btn btn toolrow" style="margin-left:18px;border:0;background:transparent;font-size:23px">↶</button>
        <button class="btn" style="margin-left:auto;border:0;background:transparent;color:#aaa">↷</button>
        <button class="btn" style="border:0;background:transparent;color:#777;margin-left:auto">clear all</button>
        <button class="btn" style="border:0;background:transparent;font-size:22px">⚒</button>
      </div>
      <button class="btn" data-key="7">7</button><button class="btn" data-key="8">8</button><button class="btn" data-key="9">9</button><button class="btn op" data-key="/">÷</button>
      <button class="btn" data-key="4">4</button><button class="btn" data-key="5">5</button><button class="btn" data-key="6">6</button><button class="btn op" data-key="*">×</button>
      <button class="btn" data-key="1">1</button><button class="btn" data-key="2">2</button><button class="btn" data-key="3">3</button><button class="btn op" data-key="-">−</button>
      <button class="btn" data-key="0">0</button><button class="btn" data-key=".">.</button><button class="btn" data-key="ans">ans</button><button class="btn op" data-key="+">+</button>
    </div>

    <div class="rightkeys">
      <button class="btn" data-key="%">%</button>
      <button class="btn math" data-action="fraction">a<br>―<br>b</button>
      <button class="btn wide" data-action="back">←</button>
      <button class="btn wide" data-action="forward">→</button>
      <button class="btn wide" data-action="delete">⌫</button>
      <button class="btn enter" data-action="enter">↵</button>
    </div>
  </section>
</main>
<div class="footer">Terms of Service&nbsp;&nbsp; | &nbsp;&nbsp;Privacy Policy&nbsp;&nbsp; | &nbsp;&nbsp;Help</div>

<script>
const rowsEl=document.getElementById('rows');
const exprEl=document.getElementById('expression');
const warningEl=document.getElementById('warning');
let expr='', previousAnswer=null, committed=[];

function render(s){
  if(!s)return '';
  let t=s;
  t=t.replace(/sqrt\(([^)]*)\)/g,'<span class="radical">√<span style="font-size:.8em">$1</span></span>');
  t=t.replace(/abs\(([^)]*)\)/g,'|$1|');
  t=t.replace(/(\d+)\^(\d+)/g,'$1<span class="sup">$2</span>');
  t=t.replace(/(\d+)\s*\/\s*(\d+)/g,'<span class="frac"><span class="top">$1</span><span class="bottom">$2</span></span>');
  t=t.replace(/\*/g,' × ').replace(/\+/g,' + ').replace(/-/g,' − ').replace(/\//g,' ÷ ');
  return t;
}
function clean(s){return s.replace(/\s/g,'')}
function evaluate(s){
  let x=clean(s).replace(/sqrt\(([^()]*)\)/g,'Math.sqrt($1)').replace(/abs\(([^()]*)\)/g,'Math.abs($1)').replace(/\^/g,'**');
  if(!/^[0-9+\-*/().%**Mathsqrtabs]+$/.test(x)) return null;
  try{let v=Function('"use strict";return ('+x+')')();return Number.isFinite(v)?v:null}catch(e){return null}
}
function draw(){
  exprEl.innerHTML=render(expr);
  warningEl.textContent=(expr && evaluate(expr)===null)?'⚠':'';
}
function commit(){
  if(!expr)return;
  let val=evaluate(expr);
  if(val===null){draw();return}
  committed.push({e:expr,a:val});
  previousAnswer=val;
  expr='';
  rowsEl.innerHTML=committed.map(r=>`<div class="row"><span>${render(r.e)}</span><span class="answer">= ${r.a}</span></div>`).join('');
  draw();
}
function add(v){expr+=v;draw()}
document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>add(b.dataset.key)));
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{
  let a=b.dataset.action;
  if(a==='enter')commit();
  else if(a==='delete')expr=expr.slice(0,-1);
  else if(a==='back')expr=expr.slice(0,-1);
  else if(a==='square')expr+='^2';
  else if(a==='power')expr+='^';
  else if(a==='sqrt')expr+='sqrt(';
  else if(a==='abs')expr+='abs(';
  else if(a==='fraction')expr+='/';
  draw();
}));
document.addEventListener('keydown',e=>{
  if(/[0-9.+\-*/()%]/.test(e.key)){add(e.key);e.preventDefault()}
  if(e.key==='Enter'){commit();e.preventDefault()}
  if(e.key==='Backspace'){expr=expr.slice(0,-1);draw()}
});
draw();
</script>
</body>
</html>
