<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desmos | Scientific Calculator</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#333;background:#fff}
body{min-height:1304px;overflow-x:hidden}
.topbar{height:52px;width:100%;position:relative;background:#f0f1f3;border-bottom:1px solid #dedfe1;color:#555;display:flex;align-items:center;justify-content:space-between;padding:0 15px}
.logo{font-size:32px;line-height:1;color:#85898c;font-weight:300;letter-spacing:-2px;cursor:pointer}
.nav{position:absolute;left:50%;transform:translateX(-50%);height:100%;display:flex;align-items:center;gap:25px;font-size:16px;color:#555}
.nav-item{white-space:nowrap;cursor:pointer}
.chevron{display:inline-block;margin:0 0 3px 5px;border:5px solid transparent;border-top-color:#73777b;border-bottom:0}
.account{display:flex;align-items:center;gap:8px;font-size:16px}
.account button{height:39px;padding:0 12px;border:1px solid #c9cdd1;border-radius:2px;background:#f8f8f8;color:#555;font-size:16px;cursor:pointer}
.account .signup{background:#3678d4;color:#fff;border-color:#3678d4;padding:0 13px}
.icon{width:30px;text-align:center;color:#73777b;font-size:17px;cursor:pointer}
main{position:relative;min-height:1200px}
.calculator{position:absolute;top:315px;left:50%;transform:translateX(-50%);width:600px;border:1px solid #d7d7d7;background:#fff}
.graph{height:296px;border-bottom:1px solid #d6d6d6;background:#fff}
.rows{width:100%}
.expr-row{height:58px;border-bottom:1px solid #d4d4d4;display:flex;align-items:center;padding:0 14px;font-family:Georgia,"Times New Roman",serif;font-size:19px;color:#292929}
.expr-row .math{flex:1;white-space:nowrap}
.expr-row .answer{min-width:72px;text-align:right;border-left:1px solid #f3f3f3;padding-left:10px}
.active-expression{height:58px;border:2px solid #4a82d5;display:flex;align-items:center;padding:0 14px;font-family:Georgia,"Times New Roman",serif;font-size:19px;position:relative}
.active-expression .math{flex:1;min-width:0;white-space:nowrap}
.active-expression .answer{min-width:72px;text-align:right}
.caret{display:inline-block;width:1px;height:22px;background:#333;margin-left:2px;vertical-align:middle;animation:blink 1.1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.keypad{height:216px;background:#f0f0f0;padding:0 5px 5px}
.toolrow{height:42px;display:flex;align-items:center;gap:0;color:#62666b;font-size:14px}
.tooltab{height:100%;min-width:72px;text-align:center;padding-top:10px;cursor:pointer;position:relative}
.tooltab.selected:after{content:"";position:absolute;bottom:0;left:0;right:0;height:4px;background:#3979d2}
.angle{margin-left:8px;display:flex;align-items:center;font-size:13px}
.angle button{height:26px;border:1px solid #c4c7ca;background:#f5f5f5;color:#555;padding:0 8px;cursor:pointer}
.angle .chosen{background:#dce8f9;color:#3472c8;border-color:#77a0d7}
.toolicon{flex:1;text-align:center;color:#777;font-size:19px;cursor:pointer}
.clear{width:90px;text-align:center;cursor:pointer;color:#777}
.wrench{width:35px;text-align:center;font-size:19px;cursor:pointer}
.keygrid{height:164px;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(4,1fr);gap:4px;padding-top:5px}
.key{border:1px solid #d2d3d5;background:#fff;box-shadow:0 1px 1px #ddd;border-radius:2px;text-align:center;display:flex;align-items:center;justify-content:center;color:#252525;font-size:18px;cursor:pointer;user-select:none}
.key:active{background:#dbe8fb}
.key.num{background:#c9c9c9;border-color:#c3c3c3}
.key.op{background:#fff;color:#555}
.key.side{background:#fff}
.key.back{grid-column:8/10;grid-row:3}
.key.enter{grid-column:8/10;grid-row:4;background:#3678d4;border-color:#3678d4;color:#fff;font-size:25px}
.key.percent{grid-column:8;grid-row:1}
.key.frac{grid-column:9;grid-row:1}
.key.leftarr{grid-column:8;grid-row:2;background:#c9c9c9}
.key.rightarr{grid-column:9;grid-row:2;background:#c9c9c9}
.key.fn1{grid-column:1;grid-row:1}.key.fn2{grid-column:2;grid-row:1}.key.fn3{grid-column:3;grid-row:1}
.key.fn4{grid-column:1;grid-row:2}.key.fn5{grid-column:2;grid-row:2}.key.fn6{grid-column:3;grid-row:2}
.key.fn7{grid-column:1;grid-row:3}.key.fn8{grid-column:2;grid-row:3}.key.fn9{grid-column:3;grid-row:3}
.key.fn10{grid-column:1;grid-row:4}.key.fn11{grid-column:2;grid-row:4}.key.fn12{grid-column:3;grid-row:4}
.key.n7{grid-column:4;grid-row:1}.key.n8{grid-column:5;grid-row:1}.key.n9{grid-column:6;grid-row:1}.key.div{grid-column:7;grid-row:1}
.key.n4{grid-column:4;grid-row:2}.key.n5{grid-column:5;grid-row:2}.key.n6{grid-column:6;grid-row:2}.key.mul{grid-column:7;grid-row:2}
.key.n1{grid-column:4;grid-row:3}.key.n2{grid-column:5;grid-row:3}.key.n3{grid-column:6;grid-row:3}.key.minus{grid-column:7;grid-row:3}
.key.n0{grid-column:4;grid-row:4}.key.dot{grid-column:5;grid-row:4}.key.ans{grid-column:6;grid-row:4}.key.plus{grid-column:7;grid-row:4}
footer{position:fixed;left:0;right:0;bottom:0;height:43px;display:flex;justify-content:center;align-items:flex-start;padding-top:8px;color:#858585;font-size:14px;background:#fff}
footer a{color:#858585;text-decoration:none;cursor:pointer}
footer .sep{padding:0 10px;color:#c6c6c6}
@media(max-width:700px){.calculator{width:calc(100% - 20px);top:180px}.nav{display:none}.logo{font-size:27px}.keygrid{gap:3px}.key{font-size:15px}.tooltab{min-width:52px}.clear{width:58px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo btn" onclick="clearAll()">desmos</div>
  <nav class="nav">
    <div class="nav-item btn">Math Tools<span class="chevron"></span></div>
    <div class="nav-item btn">Resources<span class="chevron"></span></div>
    <div class="nav-item btn">Partnerships<span class="chevron"></span></div>
  </nav>
  <div class="account">
    <button class="btn">Log In</button><button class="signup btn">Sign Up</button>
    <span class="icon btn" title="Language">◉</span><span class="icon btn" title="Print">▣</span>
  </div>
</header>
<main>
  <section class="calculator" aria-label="Scientific calculator">
    <div class="graph"></div>
    <div class="rows" id="rows"></div>
    <div class="active-expression btn" id="active" onclick="focusInput()">
      <span class="math" id="activeMath"></span><span class="caret" id="caret"></span><span class="answer" id="activeAnswer"></span>
    </div>
    <div class="keypad">
      <div class="toolrow">
        <div class="tooltab selected btn">main</div><div class="tooltab btn">abc</div><div class="tooltab btn">func</div>
        <div class="angle"><button class="btn">RAD</button><button class="chosen btn">DEG</button></div>
        <div class="toolicon btn" onclick="undo()">↶</div><div class="toolicon btn" onclick="redo()">↷</div>
        <div class="clear btn" onclick="clearAll()">clear all</div><div class="wrench btn">🔧</div>
      </div>
      <div class="keygrid">
        <div class="key fn1 btn" data-value="^2"><i>a</i><sup>2</sup></div>
        <div class="key fn2 btn" data-value="^"><i>a</i><sup>b</sup></div>
        <div class="key fn3 btn" data-value="abs"><i>|a|</i></div>
        <div class="key fn4 btn" data-value="sqrt">√</div>
        <div class="key fn5 btn" data-value="root">ⁿ√</div>
        <div class="key fn6 btn" data-value="pi">π</div>
        <div class="key fn7 btn" data-value="sin">sin</div>
        <div class="key fn8 btn" data-value="cos">cos</div>
        <div class="key fn9 btn" data-value="tan">tan</div>
        <div class="key fn10 btn" data-value="(">(</div>
        <div class="key fn11 btn" data-value=")">)</div>
        <div class="key fn12 btn" data-value=",">,</div>
        <div class="key n7 num btn" data-value="7">7</div><div class="key n8 num btn" data-value="8">8</div><div class="key n9 num btn" data-value="9">9</div>
        <div class="key div op btn" data-value="/">÷</div>
        <div class="key n4 num btn" data-value="4">4</div><div class="key n5 num btn" data-value="5">5</div><div class="key n6 num btn" data-value="6">6</div>
        <div class="key mul op btn" data-value="*">×</div>
        <div class="key n1 num btn" data-value="1">1</div><div class="key n2 num btn" data-value="2">2</div><div class="key n3 num btn" data-value="3">3</div>
        <div class="key minus op btn" data-value="-">−</div>
        <div class="key n0 num btn" data-value="0">0</div><div class="key dot num btn" data-value=".">.</div><div class="key ans btn" data-value="ans">ans</div>
        <div class="key plus op btn" data-value="+">+</div>
        <div class="key percent side btn" data-value="%">%</div><div class="key frac side btn" data-value="/">a⁄b</div>
        <div class="key leftarr btn" data-action="left">←</div><div class="key rightarr btn" data-action="right">→</div>
        <div class="key back btn" data-action="back">⌫</div>
        <div class="key enter btn" data-action="enter">↵</div>
      </div>
    </div>
  </section>
</main>
<footer><a class="btn">Terms of Service</a><span class="sep">|</span><a class="btn">Privacy Policy</a><span class="sep">|</span><a class="btn">Help</a></footer>
<script>
const rowsEl=document.getElementById('rows'), activeMath=document.getElementById('activeMath'), activeAnswer=document.getElementById('activeAnswer'), caret=document.getElementById('caret');
let expr='',history=[],redoStack=[],lastAnswer='0',cursor=0;
function pretty(s){
  let safe=s.replace(/</g,'&lt;').replace(/>/g,'&gt;');
  safe=safe.replace(/\^2/g,'<sup>2</sup>').replace(/\^([0-9]+)/g,'<sup>$1</sup>').replace(/\*/g,' × ').replace(/\//g,' ÷ ').replace(/-/g,'−');
  safe=safe.replace(/sqrt\(/g,'√(').replace(/pi/g,'π').replace(/abs\(/g,'|').replace(/\)/g,'|');
  return safe;
}
function calculate(s){
  if(!s.trim())return '';
  try{
    let q=s.replace(/π/g,'Math.PI').replace(/\bans\b/g,lastAnswer).replace(/sqrt\(/g,'Math.sqrt(').replace(/abs\(/g,'Math.abs(').replace(/\^/g,'**').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');
    if(!/^[0-9+\-*/().,\sA-Za-z]*$/.test(q))return '';
    let val=Function('"use strict";return ('+q+')')();
    if(typeof val!=='number'||!Number.isFinite(val))return '';
    return Number.isInteger(val)?String(val):String(Number(val.toPrecision(10)));
  }catch(e){return ''}
}
function render(){
 activeMath.innerHTML=pretty(expr);
 let result=calculate(expr);
 activeAnswer.textContent=result?'= '+result:'';
 caret.style.display='inline-block';
 rowsEl.innerHTML='';
 history.forEach(item=>{
   let row=document.createElement('div');row.className='expr-row';
   row.innerHTML='<span class="math">'+pretty(item.expr)+'</span><span class="answer">= '+item.answer+'</span>';
   rowsEl.appendChild(row);
 });
}
function insert(v){
 if(v==='sqrt'){expr+='sqrt(';cursor=expr.length}
 else if(v==='root'){expr+='sqrt(';cursor=expr.length}
 else if(v==='abs'){expr+='abs(';cursor=expr.length}
 else if(v==='pi'){expr+='pi';cursor=expr.length}
 else if(v==='ans'){expr+='ans';cursor=expr.length}
 else {expr=expr.slice(0,cursor)+v+expr.slice(cursor);cursor+=v.length}
 render();
}
function submit(){
 const answer=calculate(expr);
 if(!expr.trim()||!answer)return;
 history.push({expr,answer});lastAnswer=answer;redoStack=[];
 expr='';cursor=0;render();
}
function clearAll(){history=[];expr='';cursor=0;lastAnswer='0';redoStack=[];render()}
function undo(){if(expr){redoStack.push(expr);expr='';cursor=0}else if(history.length){let v=history.pop();redoStack.push(v);expr=v.expr;cursor=expr.length}render()}
function redo(){let v=redoStack.pop();if(!v)return;if(typeof v==='string'){expr=v;cursor=expr.length}else history.push(v);render()}
function focusInput(){caret.style.display='inline-block'}
document.querySelectorAll('.key[data-value]').forEach(k=>k.addEventListener('click',()=>insert(k.dataset.value)));
document.querySelectorAll('.key[data-action]').forEach(k=>k.addEventListener('click',()=>{
 const a=k.dataset.action;
 if(a==='enter')submit();
 else if(a==='back'){if(cursor>0){expr=expr.slice(0,cursor-1)+expr.slice(cursor);cursor--}render()}
 else if(a==='left')cursor=Math.max(0,cursor-1);
 else if(a==='right')cursor=Math.min(expr.length,cursor+1);
}));
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'){e.preventDefault();submit()}
 else if(e.key==='Backspace'){e.preventDefault();if(cursor>0){expr=expr.slice(0,cursor-1)+expr.slice(cursor);cursor--}render()}
 else if(e.key==='Escape'){clearAll()}
 else if(/^[0-9.+\-*/(),]$/.test(e.key)){insert(e.key)}
});
render();
</script>
</body>
</html>
